name: Auto-publish news

# Runs in GitHub's cloud — your computer does not need to be on.
on:
  schedule:
    # Bangladesh time (UTC+6): 07:00, 14:00 and 21:00 daily
    - cron: "0 1 * * *"
    - cron: "0 8 * * *"
    - cron: "0 15 * * *"
  workflow_dispatch: # lets you (or Claude) trigger a run manually

permissions:
  contents: write

concurrency:
  group: auto-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet feedparser anthropic playwright

      # Chromium renders the Bangla photocards. Satori was tried and mangled
      # every matra, so a real browser engine is doing the text shaping.
      - name: Install Chromium for photocards
        run: python -m playwright install --with-deps chromium

      - name: Collect, write and publish
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional — posting is skipped entirely when these are absent.
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}
          MAX_NEW_ARTICLES: "6"
          MAX_FB_POSTS: "3"
          CLAUDE_MODEL: claude-sonnet-5
        run: python scripts/auto_publish.py

      # The gate: if the run produced malformed data, fail here so nothing is
      # committed. Catching it before the commit is far cheaper than reverting
      # a bad publish that readers and Google have already seen.
      - name: Validate before publishing
        run: python scripts/validate_data.py

      - name: Commit and push if anything changed
        run: |
          git config user.name  "BD Site News Bot"
          git config user.email "bot@bdsitenews.com"
          git add src/data/articles.json src/data/stories.json public/covers public/cards
          if git diff --staged --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git commit -m "Auto-publish: $(date -u '+%Y-%m-%d %H:%M UTC')"

          # Anyone pushing while this run was writing makes the push bounce,
          # and the articles are already written and paid for. Rebase onto
          # whatever landed and try again instead of throwing the run away.
          for attempt in 1 2 3; do
            if git push; then
              echo "Published — Vercel will deploy automatically."
              exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto the latest main."
            if ! git pull --rebase origin main; then
              # Never auto-resolve: picking a side here silently deletes
              # somebody's articles. Stop and let a human merge both.
              git rebase --abort || true
              echo "::error::Rebase conflict — resolve by hand so no article is dropped."
              exit 1
            fi
          done
          echo "::error::Could not push after 3 attempts."
          exit 1
