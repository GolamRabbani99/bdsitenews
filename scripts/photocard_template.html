<meta charset="utf-8" />
<title>Photocard</title>
<!-- Font is bundled, not fetched. A network failure here would fall back to a
     font with no Bangla glyphs and render a card full of empty boxes. -->
<link href="fonts/bengali.css" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  /* 4:5 is the tallest ratio Facebook and Instagram show uncropped, so it
     takes the most feed height for the same post. */
  body { width: 1080px; height: 1350px; background: #0d0d0f; overflow: hidden; }

  .card {
    position: relative;
    width: 1080px; height: 1350px;
    font-family: "Noto Sans Bengali", sans-serif;
    display: flex; flex-direction: column;
  }

  /* ---- masthead ---- */
  .top {
    display: flex; align-items: center; justify-content: space-between;
    padding: 40px 48px 28px;
    background: #0d0d0f;
  }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand img { height: 54px; width: auto; }
  .chip {
    font-size: 30px; font-weight: 700; color: #fff;
    background: #c8102e;
    padding: 9px 26px; border-radius: 999px;
    letter-spacing: .3px;
  }
  .date { font-size: 27px; color: #9aa0a6; font-weight: 500; }

  /* ---- photo ---- */
  .photo { position: relative; flex: 1; overflow: hidden; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* The gradient is what makes white text readable over any photo — without
     it a bright sky swallows the headline. */
  .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(
      to bottom,
      rgba(13,13,15,0) 0%,
      rgba(13,13,15,0.15) 38%,
      rgba(13,13,15,0.82) 68%,
      rgba(13,13,15,0.97) 100%
    );
  }
  .credit {
    position: absolute; top: 22px; right: 26px;
    font-size: 20px; color: rgba(255,255,255,.82);
    background: rgba(0,0,0,.45);
    padding: 7px 16px; border-radius: 6px;
    font-weight: 500;
  }

  /* ---- headline ---- */
  .headline {
    position: absolute; left: 0; right: 0; bottom: 0;
    padding: 0 52px 44px;
  }
  .rule { width: 92px; height: 7px; background: #c8102e; margin-bottom: 26px; border-radius: 4px; }
  h1 {
    color: #fff;
    font-weight: 800;
    font-size: 68px;
    line-height: 1.34;
    text-shadow: 0 3px 22px rgba(0,0,0,.75);
    /* Bangla needs more leading than Latin; matras sit above the line and
       collide at tighter values. */
  }
  h1.long  { font-size: 58px; }
  h1.xlong { font-size: 50px; }

  /* ---- footer ---- */
  .bottom {
    display: flex; align-items: center; justify-content: space-between;
    padding: 26px 48px 34px;
    background: #0d0d0f;
  }
  .site { font-size: 31px; font-weight: 700; color: #fff; letter-spacing: .4px; }
  .tag  { font-size: 25px; color: #9aa0a6; font-weight: 500; }

  /* ---- no photo (explainers, debates, anything with no cover) ----
     Without this the card is a black void with a broken-image icon. The
     headline moves up and becomes the subject of the card instead. */
  .no-photo .photo img,
  .no-photo .credit { display: none; }
  .no-photo .photo {
    background:
      radial-gradient(circle at 22% 18%, rgba(200,16,46,.34) 0%, transparent 56%),
      radial-gradient(circle at 82% 82%, rgba(200,16,46,.18) 0%, transparent 52%),
      #131317;
  }
  .no-photo .scrim { background: none; }
  .no-photo .headline {
    top: 0;
    display: flex; flex-direction: column; justify-content: center;
    padding: 0 60px;
  }
  .no-photo h1        { font-size: 82px; text-shadow: none; }
  .no-photo h1.long   { font-size: 70px; }
  .no-photo h1.xlong  { font-size: 60px; }
</style>

<div class="card __CARDCLASS__">
  <div class="top">
    <div class="brand">
      <span class="chip" id="category">__CATEGORY__</span>
    </div>
    <div class="date" id="date">__DATE__</div>
  </div>

  <div class="photo">
    <img id="photo" src="__IMAGE__" alt="" />
    <div class="scrim"></div>
    <div class="credit" id="credit">__CREDIT__</div>
    <div class="headline">
      <div class="rule"></div>
      <h1 id="headline">__HEADLINE__</h1>
    </div>
  </div>

  <div class="bottom">
    <div class="site">bdsitenews.com</div>
    <div class="tag">দ্রুত সংবাদ, নির্ভরযোগ্য তথ্য</div>
  </div>
</div>

<script>
  // Long Bangla headlines must step down or they overrun the card.
  const h = document.getElementById("headline");
  const n = h.textContent.trim().length;
  if (n > 95) h.className = "xlong";
  else if (n > 62) h.className = "long";
</script>
